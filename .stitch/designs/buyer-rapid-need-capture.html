<div class="flex items-center">

</div>
</div>

<div class="absolute bottom-0 left-0 w-full h-[2px] bg-surface-container">
<div class="h-full bg-primary w-1/2 transition-all duration-300"></div>
</div>
</header>
<!-- Main Content -->
<main class="flex-grow w-full max-w-md mx-auto px-edge-margin pt-section-gap pb-section-gap flex flex-col gap-section-gap">
<!-- Header Section -->
<div class="flex flex-col gap-2">
<h1 class="font-headline-lg-mobile text-headline-lg-mobile text-on-surface md:font-headline-lg md:text-headline-lg">What are you looking for?</h1>
<p class="text-measured-slate">Tell us the product or requirement. You can add details only if you know them.</p>
<div class="flex items-center gap-2 mt-2 bg-blue-mist/30 px-3 py-2 rounded-lg w-fit">
<span class="material-symbols-outlined text-primary text-[18px]" data-icon="check_circle">check_circle</span>
<span class="text-sm font-medium text-primary-container">Your contact details are saved</span>
</div>
</div>
<!-- Forms Section -->
<div class="flex flex-col gap-stack-gap">
<!-- Main Input -->
<div class="flex flex-col gap-label-gap">
<label class="text-measured-slate font-medium" for="main_req">Product or requirement <span class="text-error">*</span></label>
<textarea class="w-full bg-pure-surface border border-glass-border rounded-[10px] p-4 text-on-surface placeholder:text-outline-variant focus:ring-2 focus:ring-primary focus:border-primary focus:outline-none transition-all resize-none shadow-sm" id="main_req" placeholder="e.g. product name, material, or what you need" rows="4"></textarea>
<span class="text-sm text-measured-slate">A short description is enough to start.</span>
</div>
<!-- Divider -->
<div class="flex items-center gap-4 my-2">
<div class="h-px bg-glass-border flex-grow"></div>
<span class="font-label-caps text-label-caps text-outline uppercase tracking-wider">OR</span>
<div class="h-px bg-glass-border flex-grow"></div>
</div>
<!-- Optional Search -->
<div class="flex flex-col gap-label-gap">
<label class="text-measured-slate font-medium" for="search_area">Search our product areas (optional)</label>
<div class="relative">
<span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-outline-variant" data-icon="search">search</span>
<input class="w-full bg-pure-surface border border-glass-border rounded-[10px] pl-10 pr-4 py-3 text-on-surface placeholder:text-outline-variant focus:ring-2 focus:ring-primary focus:border-primary focus:outline-none transition-all shadow-sm h-action-height" id="search_area" placeholder="Search areas..." type="text"/>
</div>
<button class="text-primary font-medium text-sm text-left hover:underline w-fit mt-1">I know the exact product</button>
</div>
<!-- Optional Specifications Accordion -->
<div class="mt-4 border border-glass-border rounded-xl bg-pure-surface overflow-hidden shadow-sm" id="specs-accordion">
<button class="w-full flex items-center justify-between p-4 bg-surface-container-low hover:bg-surface-variant transition-colors group" onclick="document.getElementById('specs-accordion').classList.toggle('accordion-active')">
<div class="flex flex-col items-start text-left">
<span class="font-medium text-on-surface">Add specifications (optional)</span>
<span class="text-sm text-measured-slate mt-1">Quantity, pack size, standard, needed-by date, or notes.</span>
</div>
<span class="material-symbols-outlined text-outline-variant chevron group-hover:text-primary transition-colors" data-icon="expand_more">expand_more</span>
</button>
<div class="accordion-content bg-pure-surface">
<div class="p-4 flex flex-col gap-4 border-t border-glass-border">
<div class="grid grid-cols-2 gap-4">
<div class="flex flex-col gap-2">
<label class="text-sm text-measured-slate">Quantity</label>
<input class="w-full border border-glass-border rounded-lg p-2 focus:ring-2 focus:ring-primary focus:outline-none" placeholder="e.g. 500" type="text"/>
</div>
<div class="flex flex-col gap-2">
<label class="text-sm text-measured-slate">Unit</label>
<select class="w-full border border-glass-border rounded-lg p-2 focus:ring-2 focus:ring-primary focus:outline-none bg-pure-surface">
<option>kg</option>
<option>L</option>
<option>pcs</option>
</select>
</div>
</div>
<div class="flex flex-col gap-2">
<label class="text-sm text-measured-slate">Additional Notes</label>
<textarea class="w-full border border-glass-border rounded-lg p-2 focus:ring-2 focus:ring-primary focus:outline-none resize-none" placeholder="Any specific requirements..." rows="2"></textarea>
</div>
</div>
</div>
</div>
<p class="text-sm text-measured-slate mt-1">Our team can follow up for anything else.</p>
</div>
</main>
<!-- Footer Action -->
<footer class="fixed bottom-0 w-full bg-surface/90 backdrop-blur-md border-t border-glass-border p-edge-margin z-50 flex flex-col gap-3 pb-safe">
