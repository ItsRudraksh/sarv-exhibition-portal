<h1 class="font-headline-lg-mobile text-headline-lg-mobile text-primary">Check your contact details</h1>
<p class="font-body-lg text-body-lg text-on-surface-variant">We filled these from your card where possible. Confirm them and we’ll save your progress.</p>
</div>
<div class="inline-flex items-center gap-2 bg-blue-mist text-primary px-3 py-1.5 rounded-full w-fit mt-2 border border-glass-border/50">
<span class="material-symbols-outlined text-[16px]" data-icon="document_scanner">document_scanner</span>
<span class="font-label-caps text-label-caps text-primary">From card scan</span>
</div>
</section>
<!-- Form Section -->

</div>

<label class="font-body-md text-body-md text-primary font-medium pl-1" for="workEmail">Work Email</label>

</div>
</div>

<label class="font-body-md text-body-md text-primary font-medium pl-1" for="mobileNumber">Mobile Number</label>

</select>
