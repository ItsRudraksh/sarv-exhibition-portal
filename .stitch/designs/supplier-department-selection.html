<style>
    body {

    /* Custom Checkbox Styles */
    .custom-checkbox {
      appearance: none;
      background-color: #fff;
      margin: 0;
      font: inherit;
      color: currentColor;
      width: 24px;
      height: 24px;
      border: 1px solid #C9D9DF; /* glass-border */
      border-radius: 4px;
      display: grid;
      place-content: center;
      transition: all 0.2s ease-in-out;
    }

    .custom-checkbox::before {
      content: "";
      width: 14px;
      height: 14px;
      transform: scale(0);
      transition: 120ms transform ease-in-out;
      box-shadow: inset 1em 1em white;
      background-color: white;
      transform-origin: center;
      clip-path: polygon(14% 44%, 0 65%, 50% 100%, 100% 16%, 80% 0%, 43% 62%);
    }

    .custom-checkbox:checked {
      background-color: #147a9a; /* primary-container */
      border-color: #147a9a;
    }

    .custom-checkbox:checked::before {
      transform: scale(1);
    }

    .custom-checkbox:focus {
      outline: 2px solid #147a9a;
      outline-offset: 2px;
    }
  </style>
</head>

      </button>

<!-- Micro-interactions Script -->
<script>
    function updateContinueButton() {
      const checkboxes = document.querySelectorAll('input[name="departments"]');
      const continueBtn = document.getElementById('btn-continue');
      let isChecked = false;

      checkboxes.forEach((cb) => {
        if (cb.checked) {
          isChecked = true;
        }
      });

      if (isChecked) {
        continueBtn.disabled = false;
        continueBtn.classList.remove('opacity-50', 'cursor-not-allowed');
        continueBtn.classList.add('opacity-100', 'cursor-pointer');
      } else {
        continueBtn.disabled = true;
        continueBtn.classList.add('opacity-50', 'cursor-not-allowed');
        continueBtn.classList.remove('opacity-100', 'cursor-pointer');
      }
    }

    // Basic search filtering (optional but good for UX)
    document.getElementById('department-search').addEventListener('input', function(e) {
      const term = e.target.value.toLowerCase();
      const labels = document.querySelectorAll('#department-form label');
      
      labels.forEach(label => {
        const text = label.querySelector('span').textContent.toLowerCase();
        if(text.includes(term)) {
          label.style.display = 'flex';
        } else {
          label.style.display = 'none';
        }
      });
    });
  </script>
