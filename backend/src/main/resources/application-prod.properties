# =============================================================================
# Production profile - activate with spring.profiles.active=prod
# Fail-closed: empty/POC staff password and exhibition.poc=true refuse startup
# =============================================================================

server.port=${SERVER_PORT:80}
server.address=0.0.0.0
server.error.include-message=always
server.error.include-stacktrace=never

spring.datasource.url=${DATASOURCE_URL:jdbc:mysql://127.0.0.1:3306/exhibition_portal?useSSL=false&allowPublicKeyRetrieval=true&characterEncoding=utf8}
spring.datasource.username=${DATASOURCE_USERNAME:exhibition}
spring.datasource.password=${DATASOURCE_PASSWORD}

management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never

exhibition.poc=false
exhibition.reference-prefix=EP-

exhibition.cors-origins=${EXHIBITION_CORS_ORIGINS:https://exhibit.sarvbiolabs.com,https://sarvbiolabs.com,https://www.sarvbiolabs.com,http://43.225.195.200,http://43.225.195.200:8083,http://127.0.0.1,http://localhost}

exhibition.storage-root=${EXHIBITION_STORAGE_ROOT:C:/exhibition-portal/files}
exhibition.staff-bootstrap-password=${EXHIBITION_STAFF_BOOTSTRAP_PASSWORD:}

exhibition.outbox.schedule-enabled=true
exhibition.outbox.marketing-destination=${EXHIBITION_OUTBOX_MARKETING:local-mailbox}
exhibition.outbox.vendor-destination=${EXHIBITION_OUTBOX_VENDOR:local-vendor-stub}
exhibition.outbox.force-failure-code=

# Pharma-erp sync - set enabled + password on the host after go-live
exhibition.pharma-erp.enabled=${EXHIBITION_PHARMA_ERP_ENABLED:false}
exhibition.pharma-erp.jdbc-url=${EXHIBITION_PHARMA_ERP_JDBC_URL:jdbc:mysql://127.0.0.1:3306/pharmadb?useSSL=false&allowPublicKeyRetrieval=true&characterEncoding=utf8}
exhibition.pharma-erp.username=${EXHIBITION_PHARMA_ERP_USERNAME:root}
exhibition.pharma-erp.password=${EXHIBITION_PHARMA_ERP_PASSWORD:}
exhibition.pharma-erp.schedule-enabled=${EXHIBITION_PHARMA_ERP_SCHEDULE:false}
exhibition.pharma-erp.sync-cron=${EXHIBITION_PHARMA_ERP_CRON:0 0 2 * * MON}
