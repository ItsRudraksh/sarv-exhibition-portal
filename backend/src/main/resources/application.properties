# =============================================================================
# Exhibition Portal - all configurable settings (default / local profile)
# Override via environment variables (${ENV:default}) or profile files:
#   application-prod.properties, application-ci.properties
# =============================================================================

# --- Spring / server ---------------------------------------------------------
spring.application.name=exhibition-portal

spring.datasource.url=${DATASOURCE_URL:jdbc:mysql://localhost:3306/exhibition_portal?useSSL=false&allowPublicKeyRetrieval=true&characterEncoding=utf8}
spring.datasource.username=${DATASOURCE_USERNAME:exhibition}
spring.datasource.password=${DATASOURCE_PASSWORD:exhibition}

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

spring.servlet.multipart.max-file-size=21MB
spring.servlet.multipart.max-request-size=21MB

server.port=8080
# Empty = origin root (IP:port or exhibit.sarvbiolabs.com). Set /exhibit for sarvbiolabs.com/exhibit.
server.servlet.context-path=${SERVER_SERVLET_CONTEXT_PATH:}
# Trust IIS/ARR X-Forwarded-* when the public URL is 80/443 in front of 8083.
server.forward-headers-strategy=framework

management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=when_authorized

# --- Exhibition product / ops ------------------------------------------------
# poc=true shows prototype banners via GET /api/v1/meta; receipt prefix POC-
exhibition.poc=true
exhibition.reference-prefix=POC-
exhibition.default-campaign-id=22222222-2222-4222-8222-222222222222

# CORS for Vite dev + LAN phones (wildcards via allowedOriginPatterns)
exhibition.cors-origins=http://localhost:5173,https://localhost:5173,http://127.0.0.1:5173,https://127.0.0.1:5173,https://192.168.*.*:5173,http://192.168.*.*:5173,https://10.*.*.*:5173,http://10.*.*.*:5173

# Private file store (card / catalogue bytes). MySQL holds metadata only.
exhibition.storage-root=${EXHIBITION_STORAGE_ROOT:./var/exhibition-files}
exhibition.file-retention-days=730
exhibition.card-max-bytes=10485760
# Supporting attachments (catalogue / buyer files): 5 MiB each, up to 10 files.
exhibition.catalogue-max-bytes=5242880
exhibition.attachment-max-count=10
exhibition.consent-policy-version=card-extraction-v1
exhibition.export-retention-hours=24

# Staff HTTP Basic bootstrap (empty locally = seed password poc-staff). Required in prod.
exhibition.staff-bootstrap-password=${EXHIBITION_STAFF_BOOTSTRAP_PASSWORD:}

# --- Outbox (CRM / vendor stubs until live APIs are chosen) -------------------
exhibition.outbox.schedule-enabled=true
exhibition.outbox.max-attempts=5
exhibition.outbox.backoff-seconds=30
exhibition.outbox.marketing-destination=${EXHIBITION_OUTBOX_MARKETING:local-mailbox}
exhibition.outbox.vendor-destination=${EXHIBITION_OUTBOX_VENDOR:local-vendor-stub}
exhibition.outbox.force-failure-code=

# --- Pharma-erp finished-goods DB sync (buyer catalogue) ---------------------
# enabled=true alone does not fill the buy list — restart the API, then Staff ->
# Sync finished goods (or POST /api/v1/staff/finished-goods/sync). Weekly cron later.
exhibition.pharma-erp.enabled=${EXHIBITION_PHARMA_ERP_ENABLED:true}
exhibition.pharma-erp.jdbc-url=${EXHIBITION_PHARMA_ERP_JDBC_URL:jdbc:mysql://127.0.0.1:3306/pharmadb?useSSL=false&allowPublicKeyRetrieval=true&characterEncoding=utf8}
exhibition.pharma-erp.username=${EXHIBITION_PHARMA_ERP_USERNAME:botuser}
exhibition.pharma-erp.password=${EXHIBITION_PHARMA_ERP_PASSWORD:botpass123}
exhibition.pharma-erp.schedule-enabled=${EXHIBITION_PHARMA_ERP_SCHEDULE:false}
exhibition.pharma-erp.sync-cron=${EXHIBITION_PHARMA_ERP_CRON:0 0 2 * * MON}
